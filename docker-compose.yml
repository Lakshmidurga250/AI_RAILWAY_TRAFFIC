version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: railway_ai_backend
    restart: always
    environment:
      - APP_NAME=AI Railway Traffic Optimization Platform
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://railway_user:railway_secure_pass_2026@postgres:5432/railway_traffic
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=railway-ai-super-secret-production-key-change-in-prod-2026
      - ENABLE_METRICS=True
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./ai/registry/models:/app/ai/registry/models

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: railway_ai_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: railway_ai_worker
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://railway_user:railway_secure_pass_2026@postgres:5432/railway_traffic
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: railway_postgres
    restart: always
    environment:
      - POSTGRES_USER=railway_user
      - POSTGRES_PASSWORD=railway_secure_pass_2026
      - POSTGRES_DB=railway_traffic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway_user -d railway_traffic"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railway_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: railway_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: railway_grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards

volumes:
  pgdata:
  grafanadata:
